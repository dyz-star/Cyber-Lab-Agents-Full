# =============================================
# Cyber-Lab-Agents Docker Compose
# =============================================

version: '3.8'

services:
  cyber-lab-agents:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cyber-lab-agents
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./memory_bank:/app/memory_bank
      - ./config:/app/config
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

